name: IP-011 A4 PostgreSQL authoring query scale

on:
  pull_request:
    paths:
      - ".github/workflows/ip011-a4-authoring-query.yml"
      - "scripts/ip011-a4-authoring-benchmark.ts"
      - "packages/persistence/src/v5-authoring-search.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-query:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moirai
          POSTGRES_DB: moirai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moirai -d moirai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://moirai@127.0.0.1:5432/moirai_test
      PUBLIC_INTEGRATION_URL: >-
        ${{ vars.PUBLIC_INTEGRATION_URL || 'https://moirai-production-8ed1.up.railway.app' }}
      EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed base SHA and public smoke
        if: github.event_name == 'pull_request'
        run: pnpm smoke
      - name: Measure 20 cold processes and 50 warm reads per scale
        run: |
          set -o pipefail
          node --import tsx scripts/ip011-a4-authoring-benchmark.ts \
            | tee /tmp/ip011-a4-authoring-query.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ip011-a4-authoring-query
          path: /tmp/ip011-a4-authoring-query.json
          retention-days: 14
