name: IP-011 A4 Collection frame diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/ip011-a4-collection-diagnostic.yml"
      - "scripts/ip011-a4-collection-diagnostic.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_INTEGRATION_URL: >-
        ${{ vars.PUBLIC_INTEGRATION_URL || 'https://moirai-production-8ed1.up.railway.app' }}
      EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify deployed base SHA and public smoke
        if: github.event_name == 'pull_request'
        run: pnpm smoke
      - run: pnpm exec playwright install --with-deps webkit
      - name: Compare normal and diagnostic URL-suppressed Collection frames
        run: |
          set -o pipefail
          node --import tsx scripts/ip011-a4-collection-diagnostic.ts \
            | tee /tmp/ip011-a4-collection-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ip011-a4-collection-diagnostic
          path: /tmp/ip011-a4-collection-diagnostic.json
          retention-days: 14
