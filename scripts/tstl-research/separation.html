<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Moirai · semantic separation experiment</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 0;
        background: #fafbf7;
        color: #26312c;
        font:
          13px system-ui,
          sans-serif;
      }
      header {
        flex-shrink: 0;
        padding: 10px 14px;
        background: #fffffff2;
        border-bottom: 1px solid #d6ddd5;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      button,
      select {
        font: inherit;
        min-height: 36px;
        border: 1px solid #bbc5bd;
        border-radius: 7px;
        background: white;
        color: inherit;
        padding: 5px 9px;
      }
      button:active {
        background: #dcebdc;
      }
      label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #event {
        max-width: 100%;
        margin-top: 5px;
      }
      #note {
        font-size: 11px;
        color: #59665c;
        margin-top: 5px;
      }
      #graph {
        width: 100%;
        height: auto;
        flex: 1;
        min-height: 0;
        display: block;
        touch-action: none;
        background: #fafbf7;
      }
      #status {
        padding: 5px 14px;
        font-size: 11px;
      }
      #detail {
        position: fixed;
        right: 12px;
        top: 150px;
        max-height: 65vh;
        overflow: auto;
        width: min(360px, 92vw);
        background: #fff;
        border: 1px solid #adbbae;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 5px 25px #0002;
      }
      #detail[hidden] {
        display: none;
      }
      #detail h2 {
        font-size: 16px;
      }
      #detail ul {
        padding-left: 19px;
      }
      #legend {
        padding: 5px 14px;
        display: flex;
        gap: 14px;
        font-size: 12px;
      }
      #legend span:before {
        content: "●";
        color: var(--color);
        margin-right: 4px;
      }
      @media (max-width: 500px) {
        header {
          flex-shrink: 0;
          padding: 7px;
        }
        h1 {
          font-size: 13px;
        }
        nav {
          gap: 4px;
        }
        button,
        select {
          font-size: 11px;
          padding: 4px 6px;
          min-height: 32px;
        }
        #event {
          max-width: 100%;
          margin-top: 5px;
        }
        #note {
          font-size: 10px;
        }
        #graph {
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Moirai · r56 semantic separation study</h1>
      <nav>
        <select id="mode" aria-label="Placement and region candidate"></select>
        <select id="view" aria-label="Camera">
          <option value="overview">Three-country overview</option>
          <option value="imjin">Imjin / Yi</option>
          <option value="detail">Shared-event detail</option>
        </select>
        <button id="fixed">Fixed camera</button
        ><button id="fit">Fit X to this time window</button>
        <select id="scope" aria-label="Visible Composite regions">
          <option value="roots">Country roots</option>
          <option value="middle">Imjin + Yi</option>
          <option value="all">All 109 Composites</option>
        </select>
        <label><input type="checkbox" id="points" />Points only</label
        ><label><input type="checkbox" id="labels" checked />Labels</label>
      </nav>
      <select id="event" aria-label="Find or reveal any Event">
        <option value="">Find / reveal an Event (539)</option>
      </select>
      <div id="note">
        Experimental geometry, not certified membership areas. Fixed source Y;
        one glyph per Event. Pan / pinch or wheel to explore. No production
        default or history changes.
      </div>
    </header>
    <div id="legend">
      <span style="--color: #648756">한국사</span
      ><span style="--color: #b07951">일본사</span
      ><span style="--color: #5887ab">중국사</span
      ><span style="--color: #212921">Shared Event</span>
    </div>
    <svg id="graph" aria-label="Historical Event placement diagnostic"></svg>
    <div id="status"></div>
    <aside id="detail" hidden></aside>
    <script type="module" src="app.js"></script>
  </body>
</html>
