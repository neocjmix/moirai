name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck-test-build-audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moirai_test
          POSTGRES_USER: moirai
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moirai -d moirai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://moirai@127.0.0.1:5432/moirai_test
      APP_VERSION: 0.0.0-ci
      DEPLOY_COMMIT_SHA: ${{ github.sha }}
      DEPLOYED_AT: 1970-01-01T00:00:00.000Z
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Service dependency boundaries
        run: pnpm check:boundaries
      - name: Strict typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL migration integration
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level high

  mobile-e2e:
    name: mobile-playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - name: Mobile Atropos flow
        run: pnpm test:e2e

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
