name: Post-deploy smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Full commit SHA expected from /health and /__status
        required: true

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.expected_commit_sha == github.sha) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      PUBLIC_INTEGRATION_URL: >-
        ${{ vars.PUBLIC_INTEGRATION_URL || 'https://moirai-production-8ed1.up.railway.app' }}
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT_SHA }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify public deployment and synthetic fixture
        run: pnpm smoke
      - name: Build Clotho CLI
        run: pnpm --filter @moirai/clotho... build
      - name: Verify authenticated authoring to public Atropos
        env:
          CLOTHO_API_URL: ${{ vars.CLOTHO_API_URL }}
          CLOTHO_TOKEN: ${{ secrets.CLOTHO_TOKEN }}
        run: pnpm exec tsx scripts/clotho-smoke.ts
